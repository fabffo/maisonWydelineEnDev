<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – Maison Wydeline</title>

  <!-- Polices Google -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Oswald', sans-serif;
      background-color: #F9F4EE;
      color: #121212;
      margin: 0;
      padding-top: 100px; /* Réajusté via JS plus bas */
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #F9F4EE;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      padding: 10px 20px;
    }

    .logo h1 {
      margin: 0;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
    }

    .logo a {
      text-decoration: none;
      color: #121212;
    }

    nav {
      margin-left: auto;
      margin-right: 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 20px;
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      color: #121212;
      text-decoration: none;
      font-size: 1rem;
    }

    nav ul li a:hover {
      text-decoration: underline;
    }

    .contact-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .contact-container h2 {
      margin-top: 0;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    form label {
      font-weight: bold;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
      font-size: 1rem;
    }

    form textarea {
      resize: vertical;
      height: 120px;
    }

    form button {
      width: fit-content;
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    form button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }

    /* Responsive mobile */
    @media screen and (max-width: 600px) {
      body {
        padding-top: 180px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .logo h1 {
        font-size: 1.5rem;
      }

      nav {
        width: 100%;
        margin-top: 10px;
      }

      nav ul {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px 20px;
      }

      nav ul li {
        display: block;
        text-align: center;
      }

      nav ul li a {
        display: block;
        padding: 10px;
        background-color: rgba(0,0,0,0.05);
        border-radius: 6px;
      }

      .contact-container {
        margin: 20px 10px;
        padding: 15px;
      }

      form button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html">
        <h1>Maison Wydeline</h1>
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="index.html#products">Notre collection</a></li>
        <li><a href="apropos.html">À propos</a></li>
        <li><a href="nouscontacter.html">Nous contacter</a></li>
        <li><a href="panier.html" id="viewCart">Panier (<span id="cartCount">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <div class="contact-container">
    <h2>Nous contacter</h2>
    <p>Une question, une commande spéciale, ou simplement un mot doux ? Écrivez-nous :</p>

    <form action="mailto:contact@maisonwydeline.fr" method="post" enctype="text/plain">
      <label for="nom">Nom :</label>
      <input type="text" id="nom" name="nom" required>

      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message :</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </div>

  <footer>
    <h3>&copy; 2025 Maison Wydeline. Tous droits réservés.</h3>
  </footer>

  <!-- JS pour ajuster le padding-top dynamiquement -->
  <script>
    function adjustBodyPadding() {
      const header = document.querySelector("header");
      if (header) {
        document.body.style.paddingTop = header.offsetHeight + "px";
      }
    }
    window.addEventListener("load", adjustBodyPadding);
    window.addEventListener("resize", adjustBodyPadding);
  </script>

</body>
</html>
