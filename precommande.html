<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaussures Wydeline – Précommande</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .product-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 250px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .product-card img {
      width: 100%;
      border-bottom: 1px solid #eee;
    }
    .product-card .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff6600;
      color: white;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 3px;
    }
    .product-card h2 {
      font-size: 18px;
      margin: 10px 0;
      color: #444;
    }
    .product-card p {
      margin: 5px 0;
      color: #777;
      font-size: 14px;
    }
    .product-card button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 15px 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .product-card button:hover {
      background: #e65c00;
    }
  </style>
</head>
<body>

  <h1>Chaussures Wydeline – Précommandes</h1>

  <div class="product-grid">

    <div class="product-card">
      <span class="badge">PRE-COMMANDE</span>
      <img src="images/escarpin.jpg" alt="escarpin" />
      <h2>Sneaker Wydeline Alpha</h2>
      <p>Livraison estimée : 20 juillet 2025</p>
      <p>Prix : 120 €</p>
      <button>Précommander</button>
    </div>

    <div class="product-card">
      <span class="badge">PRE-COMMANDE</span>
      <img src="https://via.placeholder.com/250x250.png?text=Wydeline+Sneaker+2" alt="Sneaker 2 Wydeline" />
      <h2>Sneaker Wydeline Beta</h2>
      <p>Livraison estimée : 1 août 2025</p>
      <p>Prix : 135 €</p>
      <button>Précommander</button>
    </div>

    <div class="product-card">
      <span class="badge">PRE-COMMANDE</span>
      <img src="https://via.placeholder.com/250x250.png?text=Wydeline+Sneaker+3" alt="Sneaker 3 Wydeline" />
      <h2>Sneaker Wydeline Gamma</h2>
      <p>Livraison estimée : 15 août 2025</p>
      <p>Prix : 150 €</p>
      <button>Précommander</button>
    </div>

  </div>

</body>
</html>
